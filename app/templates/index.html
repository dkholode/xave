<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xave — X thread/article to PDF</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="card">
    <h1>xave</h1>
    <p class="sub">Paste an X/Twitter <strong>thread</strong> or <strong>Article</strong> link and download a clean PDF.</p>

    <form id="form">
      <input id="url" name="url" type="url" placeholder="https://x.com/user/status/123…" required autofocus>
      <label class="check">
        <input id="full" name="full" type="checkbox">
        Capture full thread / Article <span class="hint">(uses your one-time X login)</span>
      </label>
      <button id="go" type="submit">Download PDF</button>
    </form>

    <div id="status" class="status" hidden></div>
    <p class="foot">Free path needs no login. Full threads &amp; Articles need <code>python -m app.auth.login</code>.</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
