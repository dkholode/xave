[project]
name = "xave"
version = "0.1.0"
description = "Convert an X/Twitter thread or Article URL into a clean reader-style PDF."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "playwright",
    "jinja2",
    "pydantic>=2",
    "python-dotenv",
    "beautifulsoup4",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
