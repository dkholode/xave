plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.xave.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.xave.reader'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    signingConfigs {
        debug {
            def localKey = rootProject.file('.local/debug.keystore')
            if (localKey.exists()) {
                storeFile localKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        // Release builds are signed only when these are set (see RELEASING.md).
        // Without them the release APK is unsigned, which is what F-Droid expects.
        release {
            def releaseKey = System.getenv('XAVE_RELEASE_KEYSTORE')
            if (releaseKey) {
                storeFile file(releaseKey)
                storePassword System.getenv('XAVE_RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('XAVE_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('XAVE_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('XAVE_RELEASE_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Unit tests run on the JVM, where Android's own org.json is only a stub.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}
