plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.xave.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.xave.reader'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    signingConfigs {
        debug {
            def localKey = rootProject.file('.local/debug.keystore')
            if (localKey.exists()) {
                storeFile localKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
