name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.XAVE_RELEASE_KEYSTORE_BASE64 }}
          XAVE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.XAVE_RELEASE_KEYSTORE_PASSWORD }}
          XAVE_RELEASE_KEY_ALIAS: ${{ secrets.XAVE_RELEASE_KEY_ALIAS }}
          XAVE_RELEASE_KEY_PASSWORD: ${{ secrets.XAVE_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are not configured. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          XAVE_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore" ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/xave-$GITHUB_REF_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/xave-$GITHUB_REF_NAME.apk" --generate-notes --verify-tag
