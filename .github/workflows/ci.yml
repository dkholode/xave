name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build, lint, and unit tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

      - name: Capture tests
        run: |
          python3 tests/build_test_page.py
          google-chrome --headless=new --disable-gpu --dump-dom "file://$PWD/app/build/capture-tests.html" > "$RUNNER_TEMP/capture.html"
          sed -n '/<pre id="results">/,/<\/pre>/p' "$RUNNER_TEMP/capture.html"
          title=$(grep -o '<title>[^<]*</title>' "$RUNNER_TEMP/capture.html")
          echo "$title"
          case "$title" in *passed*) ;; *) exit 1 ;; esac
          case "$title" in *FAILED*) exit 1 ;; esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
